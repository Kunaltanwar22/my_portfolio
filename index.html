<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kunal's Portfolio | Web Developer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --primary: #6c63ff;
      --secondary: #4d44db;
      --dark: #2f2e41;
      --light: #f8f9fa;
      --accent: #ff6584;
    }
    
    body {
      scroll-behavior: smooth;
      font-family: 'Poppins', sans-serif;
      background-color: #ffffff;
      color: var(--dark);
      overflow-x: hidden;
    }
    
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
      100% { transform: translateY(0px); }
    }
    
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    .hero {
      background: linear-gradient(-45deg, #6c63ff, #4d44db, #23a6d5, #23d5ab);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: white;
      padding: 120px 0 100px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    
    .hero::before {
      content: '';
      position: absolute;
      bottom: -50px;
      left: 0;
      right: 0;
      height: 100px;
      background: white;
      transform: skewY(-3deg);
      z-index: 1;
    }
    
    .section-title {
      margin-bottom: 50px;
      position: relative;
      display: inline-block;
      font-weight: 700;
    }
    
    .section-title::after {
      content: '';
      position: absolute;
      width: 60%;
      height: 4px;
      bottom: -15px;
      left: 20%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 2px;
    }
    
    .project {
      transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      height: 100%;
    }
    
    .project:hover {
      transform: translateY(-10px);
      box-shadow: 0 14px 28px rgba(0,0,0,0.1), 0 10px 10px rgba(0,0,0,0.08);
    }
    
    .project img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    
    .project:hover img {
      transform: scale(1.1);
    }
    
    .hero-img {
      width: 220px;
      height: 220px;
      object-fit: cover;
      border-radius: 50%;
      margin: 20px 0;
      border: 8px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      animation: float 6s ease-in-out infinite;
    }
    
    footer {
      background-color: var(--dark);
      color: white;
      padding: 40px 0 20px;
      position: relative;
    }
    
    footer::before {
      content: '';
      position: absolute;
      top: -50px;
      left: 0;
      right: 0;
      height: 100px;
      background: white;
      transform: skewY(-3deg);
      z-index: 1;
    }
    
    .skill-item {
      padding: 20px;
      margin: 15px 0;
      background: white;
      border-radius: 12px;
      transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      border-left: 4px solid var(--primary);
    }
    
    .skill-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 14px 28px rgba(0,0,0,0.1), 0 10px 10px rgba(0,0,0,0.08);
    }
    
    .nav-pills {
      justify-content: center;
      margin-bottom: 40px;
    }
    
    .nav-pills .nav-link {
      margin: 0 10px;
      border-radius: 50px;
      padding: 8px 20px;
      font-weight: 500;
      transition: all 0.3s;
    }
    
    .nav-pills .nav-link.active {
      background: linear-gradient(45deg, var(--primary), var(--accent));
      box-shadow: 0 4px 15px rgba(108, 99, 255, 0.3);
      transform: translateY(-3px);
    }
    
    .contact-icon {
      font-size: 2.5rem;
      margin: 0 15px;
      color: var(--primary);
      transition: all 0.4s;
      display: inline-block;
    }
    
    .contact-icon:hover {
      transform: translateY(-8px) scale(1.1);
      color: var(--accent);
    }
    
    .btn-primary {
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      border: none;
      padding: 12px 30px;
      border-radius: 50px;
      font-weight: 600;
      letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(108, 99, 255, 0.3);
      transition: all 0.4s;
    }
    
    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(108, 99, 255, 0.4);
    }
    
    .btn-outline-light {
      padding: 12px 30px;
      border-radius: 50px;
      font-weight: 600;
      letter-spacing: 1px;
      transition: all 0.4s;
    }
    
    .btn-outline-light:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(255, 255, 255, 0.2);
    }
    
    .floating-shapes {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }
    
    .shape {
      position: absolute;
      opacity: 0.1;
      border-radius: 50%;
      background: white;
      animation: float 15s infinite linear;
    }
    
    .back-to-top {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 50px;
      height: 50px;
      background: linear-gradient(45deg, var(--primary), var(--accent));
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 5px 20px rgba(108, 99, 255, 0.4);
      z-index: 99;
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s;
    }
    
    .back-to-top.active {
      opacity: 1;
      visibility: visible;
    }
    
    .back-to-top:hover {
      transform: translateY(-5px);
    }
    
    .typed-text {
      min-height: 60px;
    }
    
    .project-tag {
      display: inline-block;
      background: linear-gradient(45deg, var(--primary), var(--accent));
      color: white;
      padding: 3px 12px;
      border-radius: 50px;
      font-size: 0.8rem;
      margin-right: 5px;
      margin-bottom: 5px;
    }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 30px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>
  <a href="#" class="back-to-top"><i class="bi bi-arrow-up"></i></a>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [activeTab, setActiveTab] = useState('all');
      const [isVisible, setIsVisible] = useState(false);
      const [typedText, setTypedText] = useState('');
      const texts = ["Web Developer", "Frontend Developer", "BCA Student"];
      const [currentTextIndex, setCurrentTextIndex] = useState(0);
      const [currentCharIndex, setCurrentCharIndex] = useState(0);
      const [isDeleting, setIsDeleting] = useState(false);
      
      const projects = [
        {
          id: 1,
          title: "Sustainable Travel Guide",
          description: "Sustainable Travel Guide Website would highlight the importance of minimizing negative impacts on the environment, local communities, and the economy during travel.",
          image: "https://t4.ftcdn.net/jpg/00/65/48/25/360_F_65482539_C0ZozE5gUjCafz7Xq98WB4dW6LAhqKfs.jpg",
          tags: ["HTML", "CSS"],
          github: "https://github.com/Kunaltanwar22/Sustainable_Travel_Website",
          demo: "https://kunaltanwar22.github.io/Sustainable_Travel_Website/"
        }
      ];
      
      const skills = [
        { name: "HTML5", level: 95, icon: "bi-filetype-html" },
        { name: "CSS", level: 90, icon: "bi-filetype-css" },
        { name: "JavaScript", level: 85, icon: "bi-filetype-js" },
        { name: "React", level: 60, icon: "bi-react" },
        { name: "Bootstrap", level: 90, icon: "bi-bootstrap" },
        { name: "C/C++", level: 75, icon: "bi-C/C++" },
        { name: "MySQL", level: 75, icon: "bi-MySQL" },
        { name: "Responsive Design", level: 95, icon: "bi-layout-wtf" },
      ];
      
      useEffect(() => {
        // Back to top button visibility
        const toggleVisibility = () => {
          if (window.pageYOffset > 300) {
            setIsVisible(true);
          } else {
            setIsVisible(false);
          }
        };
        
        window.addEventListener('scroll', toggleVisibility);
        
        // Typing animation
        const typingSpeed = isDeleting ? 50 : 150;
        const pauseBetween = 2000;
        
        const timer = setTimeout(() => {
          const currentText = texts[currentTextIndex];
          
          if (isDeleting) {
            setTypedText(currentText.substring(0, currentCharIndex - 1));
            setCurrentCharIndex(currentCharIndex - 1);
            
            if (currentCharIndex === 0) {
              setIsDeleting(false);
              setCurrentTextIndex((currentTextIndex + 1) % texts.length);
            }
          } else {
            setTypedText(currentText.substring(0, currentCharIndex + 1));
            setCurrentCharIndex(currentCharIndex + 1);
            
            if (currentCharIndex === currentText.length) {
              setTimeout(() => setIsDeleting(true), pauseBetween);
            }
          }
        }, typingSpeed);
        
        // Floating shapes
        const shapesContainer = document.querySelector('.floating-shapes');
        if (shapesContainer) {
          for (let i = 0; i < 10; i++) {
            const shape = document.createElement('div');
            shape.classList.add('shape');
            shape.style.width = `${Math.random() * 100 + 50}px`;
            shape.style.height = shape.style.width;
            shape.style.left = `${Math.random() * 100}%`;
            shape.style.top = `${Math.random() * 100}%`;
            shape.style.animationDuration = `${Math.random() * 20 + 10}s`;
            shape.style.animationDelay = `${Math.random() * 5}s`;
            shapesContainer.appendChild(shape);
          }
        }
        
        return () => {
          window.removeEventListener('scroll', toggleVisibility);
          clearTimeout(timer);
        };
      }, [currentCharIndex, currentTextIndex, isDeleting]);
      
      const filteredProjects = activeTab === 'all' 
        ? projects 
        : projects.filter(project => project.tags.includes(activeTab));
      
      const scrollToTop = () => {
        window.scrollTo({
          top: 0,
          behavior: 'smooth'
        });
      };
      
      return (
        <div>
          {/* Floating Background Shapes */}
          <div className="floating-shapes"></div>
          
          {/* Hero Section */}
          <section className="hero" id="home">
            <div className="container">
              <div className="glass-card animate__animated animate__fadeIn">
                <h1 className="display-4 fw-bold mb-3">Hi, I'm <span className="text-accent">Kunal</span></h1>
                <img 
                  src="WhatsApp Image 2025-04-30 at 11.29.04_91dc5783.jpg" 
                  alt="Kunal Singh Tanwar" 
                  className="hero-img" 
                />
                <div className="typed-text fs-3 fw-light mb-4">
                  I'm a <span className="fw-bold">{typedText}</span>
                  <span className="typed-cursor">|</span>
                </div>
                <div className="mt-4">
                  <a href="#projects" className="btn btn-light btn-lg mx-2 animate__animated animate__pulse animate__infinite">
                    View My Work <i className="bi bi-arrow-down ms-2"></i>
                  </a>
                  <a href="#contact" className="btn btn-outline-light btn-lg mx-2">
                    Contact Me <i className="bi bi-send ms-2"></i>
                  </a>
                </div>
              </div>
            </div>
          </section>

          {/* About Section */}
          <section className="py-5" id="about">
            <div className="container">
              <h2 className="section-title text-center animate__animated animate__fadeInUp">About Me</h2>
              <div className="row justify-content-center animate__animated animate__fadeIn" style={{ animationDelay: '0.2s' }}>
                <div className="col-lg-8">
                  <div className="card border-0 shadow-sm p-4">
                    <p className="fs-5 mb-4">
                      I'm <span className="fw-bold">Kunal Singh Tanwar</span>, a passionate BCA student at Lovely Professional University specializing in modern web development. With a keen eye for design and a love for clean code, I create digital experiences that are both beautiful and functional.
                    </p>
                    <p className="fs-5 mb-4">
                      My journey in web development began a year ago, and since then I've been constantly learning and expanding my skill set. I believe in the power of technology to solve problems and create meaningful connections.
                    </p>
                    <div className="text-center mt-4">
                      <a href="kunal CV 2.pdf" className="btn btn-primary mx-2 animate__animated animate__pulse">
                        <i className="bi bi-download me-2"></i> Download CV
                      </a>
                      <a href="#contact" className="btn btn-outline-primary mx-2">
                        <i className="bi bi-chat-square-text me-2"></i> Hire Me
                      </a>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* Skills Section */}
          <section className="py-5 bg-light" id="skills">
            <div className="container">
              <h2 className="section-title text-center animate__animated animate__fadeInUp">My Skills</h2>
              <div className="row animate__animated animate__fadeIn" style={{ animationDelay: '0.3s' }}>
                {skills.map((skill, index) => (
                  <div className="col-md-3 mb-4" key={index}>
                    <div className="skill-item">
                      <div className="d-flex align-items-center mb-3">
                        <i className={`bi ${skill.icon} fs-3 me-3`} style={{ color: 'var(--primary)' }}></i>
                        <h5 className="mb-0">{skill.name}</h5>
                      </div>
                      <div className="progress mt-2">
                        <div 
                          className="progress-bar" 
                          role="progressbar" 
                          style={{ 
                            width: `${skill.level}%`,
                            background: 'linear-gradient(45deg, var(--primary), var(--accent))',
                            animation: 'pulse 2s infinite'
                          }} 
                          aria-valuenow={skill.level} 
                          aria-valuemin="0" 
                          aria-valuemax="100"
                        ></div>
                      </div>
                      <span className="d-block mt-2 text-end fw-bold">{skill.level}%</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* Projects Section */}
          <section className="py-5" id="projects">
            <div className="container">
              <h2 className="section-title text-center animate__animated animate__fadeInUp">My Projects</h2>
              
              <ul className="nav nav-pills mb-4 animate__animated animate__fadeIn" style={{ animationDelay: '0.2s' }}>
                <li className="nav-item">
                  <button 
                    className={`nav-link ${activeTab === 'all' ? 'active' : ''}`} 
                    onClick={() => setActiveTab('all')}
                  >
                    <i className="bi bi-grid me-1"></i> HTML/CSS
                  </button>
                </li>
              </ul>
              
              <div className="row g-4 animate__animated animate__fadeIn" style={{ animationDelay: '0.4s' }}>
                {filteredProjects.map((project) => (
                  <div className="col-md-4" key={project.id}>
                    <div className="project card border-0 h-100">
                      <div className="overflow-hidden">
                        <img src={project.image} alt={project.title} className="card-img-top" />
                      </div>
                      <div className="card-body">
                        <h5 className="card-title fw-bold">{project.title}</h5>
                        <p className="card-text text-muted">{project.description}</p>
                        <div className="mb-3">
                          {project.tags.map((tag, i) => (
                            <span key={i} className="project-tag">{tag}</span>
                          ))}
                        </div>
                        <div className="d-flex">
                          <a href={project.github} className="btn btn-sm btn-outline-primary me-2">
                            <i className="bi bi-github me-1"></i> Code
                          </a>
                          <a href={project.demo} className="btn btn-sm btn-primary">
                            <i className="bi bi-eye me-1"></i> Live Demo
                          </a>
                        </div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* Contact Section */}
          <section className="py-5 bg-light" id="contact">
            <div className="container">
              <h2 className="section-title text-center animate__animated animate__fadeInUp">Get In Touch</h2>
              <div className="row justify-content-center animate__animated animate__fadeIn" style={{ animationDelay: '0.2s' }}>
                <div className="col-lg-8">
                  <div className="card border-0 shadow-sm p-4 p-md-5 text-center">
                    <h3 className="mb-4">Let's work together!</h3>
                    <p className="fs-5 mb-5">
                      I'm currently looking for new opportunities. Whether you have a project in mind or just want to say hello, I'll do my best to get back to you!
                    </p>
                    <div className="my-4">
                      <a href="mailto:kunal.tanwar@example.com" className="fs-4 text-decoration-none fw-bold">
                        <i className="bi bi-envelope me-2"></i> tanwarkunalsingh22@example.com
                      </a>
                    </div>
                    <div className="social-links">
                      <a href="https://www.linkedin.com/in/kunal-singh-tanwar/" target="_blank" rel="noopener noreferrer" className="animate__animated animate__pulse" style={{ animationDelay: '0.1s' }}>
                        <i className="bi bi-linkedin contact-icon"></i>
                      </a>
                      <a href="https://github.com/Kunaltanwar22" target="_blank" rel="noopener noreferrer" className="animate__animated animate__pulse" style={{ animationDelay: '0.2s' }}>
                        <i className="bi bi-github contact-icon"></i>
                      </a>
                      <a href="https://www.instagram.com/_.theonly_kunal._/" target="_blank" rel="noopener noreferrer" className="animate__animated animate__pulse" style={{ animationDelay: '0.4s' }}>
                        <i className="bi bi-instagram contact-icon"></i>
                      </a>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <footer className="text-center">
            <div className="container pt-5">
              <p className="mb-3">&copy; {new Date().getFullYear()} Kunal Singh Tanwar. All rights reserved.</p>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
  
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    // Back to top functionality
    document.querySelector('.back-to-top').addEventListener('click', function(e) {
      e.preventDefault();
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    });
    
    // Update back to top button class based on scroll
    window.addEventListener('scroll', function() {
      const backToTop = document.querySelector('.back-to-top');
      if (window.pageYOffset > 300) {
        backToTop.classList.add('active');
      } else {
        backToTop.classList.remove('active');
      }
    });
  </script>
</body>
</html>
